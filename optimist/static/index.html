<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="ghost icon" id="sidebar-toggle" title="Toggle chat list">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="2.4"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" transform="rotate(60 12 12)"/>
        <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" transform="rotate(120 12 12)"/>
      </svg>
      <span class="brand-name">Science Assistant</span>
      <span class="model-pill" id="model-pill">…</span>
    </div>
    <div class="topbar-actions">
      <button class="ghost" id="new-chat" title="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span>
      </button>
      <button class="ghost icon" id="theme-toggle" title="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- Conversation list -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="new-chat-btn" id="sidebar-new">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
        </button>
        <input class="filter thread-filter" id="thread-filter" placeholder="Search chats…" spellcheck="false">
      </div>
      <nav class="thread-list" id="thread-list"></nav>
    </aside>

    <div class="workarea" id="layout">
    <!-- Left: chat -->
    <section class="pane chat-pane" id="chat-pane">
      <div class="messages" id="messages">
        <div class="empty" id="empty">
          <h1>What are we investigating?</h1>
          <p>Ask a research question, test an idea against the literature, or kick off a deep literature review.</p>
          <div class="suggestions">
            <button class="chip">Is using SAM for pore segmentation in shale SEM images a novel idea?</button>
            <button class="chip">Help me formulate a research question on perovskite degradation under humidity</button>
            <button class="chip">Run a deep literature review on preprocessing methods for SEM image segmentation</button>
          </div>
        </div>
      </div>
      <div class="running-note hidden" id="running-note">
        <span class="spin"></span>Still running in the background. This chat refreshes when it finishes.
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message the assistant…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button type="submit" class="send" id="send" title="Send">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="stop hidden" id="stop" title="Stop">
          <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </form>
    </section>

    <div class="gutter gutter-v" id="gutter-v" role="separator" aria-orientation="vertical"></div>

    <!-- Right: files on top, viewer below -->
    <section class="pane side-pane" id="side-pane">
      <div class="files" id="files-panel">
        <div class="panel-head">
          <span class="panel-title">Workspace</span>
          <div class="panel-actions">
            <input class="filter" id="filter" placeholder="Filter files…" spellcheck="false">
            <button class="ghost icon" id="refresh" title="Refresh">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            </button>
          </div>
        </div>
        <div class="tree" id="tree"></div>
      </div>

      <div class="gutter gutter-h" id="gutter-h" role="separator" aria-orientation="horizontal"></div>

      <div class="viewer" id="viewer-panel">
        <div class="panel-head">
          <span class="panel-title crumbs" id="crumbs">Viewer</span>
          <div class="panel-actions" id="viewer-actions"></div>
        </div>
        <div class="viewer-body" id="viewer">
          <div class="viewer-empty">Select a file to view it here.</div>
        </div>
      </div>
    </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
