[project]
name = "optimist"
version = "0.1.0"
description = "An AI science assistant: a deepagents agent with literature, file and shell tools"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "optimistresearch",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "python-dotenv>=1.0",
    "genai-prices>=0.1",
    "prompt-toolkit>=3.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0", "optimistresearch[anthropic]"]
openai = ["langchain-openai>=1.0", "optimistresearch[openai]"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "pexpect>=4.9"]

[project.scripts]
optimist = "optimist.cli:app"

[tool.uv.sources]
deepagents = { path = "../deepagents/libs/deepagents", editable = true }
optimistresearch = { path = "../literature", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
